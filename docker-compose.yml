version: '3.8'

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: avataros-clickhouse
    ports:
      - "8123:8123"   # HTTP interface
      - "9000:9000"   # Native protocol interface
    environment:
      - CLICKHOUSE_DB=default
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./backend/init_clickhouse.sql:/docker-entrypoint-initdb.d/init_clickhouse.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - avataros_network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: avataros-backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - DEBUG=true
      - HOST=0.0.0.0
      - PORT=8000
      - FRONTEND_URL=http://localhost:3000
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - CLICKHOUSE_URL=http://clickhouse:8123
      - CLICKHOUSE_DATABASE=default
      - CLICKHOUSE_USERNAME=default
      - VAULT_STORAGE_PATH=/app/backend/static/media
      - RENDERER_PROVIDER=ffmpeg
    volumes:
      - media_data:/app/backend/static/media
    depends_on:
      clickhouse:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - avataros_network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: avataros-frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_started
    networks:
      - avataros_network

volumes:
  clickhouse_data:
    driver: local
  media_data:
    driver: local

networks:
  avataros_network:
    driver: bridge
